map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}
upstream cfg_backend {
  zone cfg_backend 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  server backend:8000 resolve;
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 4m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://$http_host wss://$http_host; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  location ~ ^/(\.well-known/|authorize(?:/|$)|token(?:/|$)|register(?:/|$)|revoke(?:/|$)) {
    proxy_pass http://cfg_backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api { proxy_pass http://cfg_backend; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $forwarded_proto; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /share/ { proxy_pass http://cfg_backend; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $forwarded_proto; }
  location /mcp { proxy_pass http://cfg_backend; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 300s; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $forwarded_proto; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /socket.io { proxy_pass http://cfg_backend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 90s; }
  location / { try_files $uri $uri/ /index.html; }
}
