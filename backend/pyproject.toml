[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "computeforgood"
version = "0.1.0"
description = "ComputeForGood coordination alpha"
requires-python = ">=3.13"
dependencies = ["fastapi==0.142.2", "uvicorn[standard]==0.54.0", "sqlalchemy==2.1.2", "psycopg[binary]==3.3.6", "alembic==1.20.0", "redis==8.1.0", "python-socketio==5.17.0", "mcp==2.2.0", "httpx==0.28.1", "cryptography==50.0.2", "pillow==12.3.0"]

[tool.setuptools.packages.find]
include = ["computeforgood*"]
