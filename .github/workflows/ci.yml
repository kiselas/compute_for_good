name: Launch verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and start the complete local alpha
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Install independent integration test dependencies
        run: python -m pip install -e backend -r tests/requirements.txt
      - name: Run PostgreSQL integration tests
        env:
          CFG_TEST_BASE_URL: http://127.0.0.1:8010
          DATABASE_URL: postgresql+psycopg://cfg:cfg-local@127.0.0.1:55471/cfg
          REDIS_URL: redis://127.0.0.1:56381/0
          CFG_TEST_WEBHOOK_SECRET: local-demo-webhook-secret
          DEMO_MODE: 'true'
        run: python -m pytest tests -v
      - name: Verify production identity and MCP authorization against real storage
        env:
          DATABASE_URL: postgresql+psycopg://cfg:cfg-local@127.0.0.1:55471/cfg
          REDIS_URL: redis://127.0.0.1:56381/0
        run: python scripts/verify-auth.py
      - name: Service diagnostics
        if: always()
        run: docker compose logs --tail 100
      - name: Stop local services
        if: always()
        run: docker compose stop
