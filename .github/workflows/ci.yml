name: Launch verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check all languages, TypeScript and production build
        working-directory: frontend
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CFG_TEST_BASE_URL: http://127.0.0.1:8010
      DATABASE_URL: postgresql+psycopg://cfg:cfg-local@127.0.0.1:55471/cfg
      REDIS_URL: redis://127.0.0.1:56381/0
      CFG_TEST_REDIS_URL: redis://127.0.0.1:56381/0
      CFG_TEST_WEBHOOK_SECRET: local-demo-webhook-secret
      CFG_PRODUCTION_BASE_URL: http://127.0.0.1:5380
      DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock.txt
            tests/requirements.txt
      - name: Install application and integration test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Create ephemeral local-only production smoke configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import secrets
          from cryptography.fernet import Fernet
          demo = Path('.env')
          demo.write_text('OAUTH_SECRET_KEY=' + Fernet.generate_key().decode() + '\n')
          demo.chmod(0o600)
          config = {
              'PUBLIC_HOST': 'http://127.0.0.1',
              'PUBLIC_URL': 'http://127.0.0.1:5380',
              'SECURE_COOKIES': 'false',
              'REGISTRATION_ENABLED': 'true',
              'POSTGRES_PASSWORD': secrets.token_hex(32),
              'GITHUB_WEBHOOK_SECRET': secrets.token_hex(32),
              'OAUTH_SECRET_KEY': Fernet.generate_key().decode(),
          }
          production = Path('.env.production-smoke')
          production.write_text(''.join(f'{key}={value}\n' for key, value in config.items()))
          production.chmod(0o600)
          PY
      - name: Start PostgreSQL, Redis, API, workers and frontend
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: Start independent demo-free production proxy stack
        run: >-
          docker compose -p cfg-production-smoke --env-file .env.production-smoke
          -f compose.production.yaml -f deploy/production-smoke.override.yaml
          up --build -d --wait --wait-timeout 240
      - name: Wait for both worker heartbeats and migrations
        run: |
          python - <<'PY'
          import time
          import urllib.request
          for url in ['http://127.0.0.1:8010/api/ready', 'http://127.0.0.1:5380/api/ready']:
              for attempt in range(60):
                  try:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          assert response.status == 200
                      break
                  except Exception:
                      if attempt == 59:
                          raise
                      time.sleep(2)
          PY
      - name: Run real storage, MCP, planning and production smoke tests
        run: python -m pytest tests -v --junitxml=tests/artifacts/verification.xml
      - name: Require all six production checks and prohibit skipped tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = ET.parse(Path('tests/artifacts/verification.xml')).getroot().findall('.//testcase')
          assert cases, 'No integration cases executed'
          assert not any(case.find('skipped') is not None for case in cases), 'CI must execute every production smoke test'
          smoke = [case for case in cases if 'test_production_smoke' in case.attrib['classname'] or case.attrib['name'] == 'test_actual_websocket_through_caddy_and_nginx_committed_public_change']
          assert len(smoke) == 6, f'Expected six production-mode checks, got {len(smoke)}'
          assert not any(case.find('failure') is not None or case.find('error') is not None for case in cases)
          PY
      - name: Verify production identity and MCP authorization against real storage
        run: python scripts/verify-auth.py
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-verification
          path: tests/artifacts/*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Service diagnostics
        if: failure()
        run: |
          docker compose logs --tail 100 backend worker integration_worker frontend
          if [ -f .env.production-smoke ]; then
            docker compose -p cfg-production-smoke --env-file .env.production-smoke -f compose.production.yaml -f deploy/production-smoke.override.yaml logs --tail 100 backend worker integration_worker frontend edge
          fi
      - name: Stop isolated runner services
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          if [ -f .env.production-smoke ]; then
            docker compose -p cfg-production-smoke --env-file .env.production-smoke -f compose.production.yaml -f deploy/production-smoke.override.yaml down --volumes --remove-orphans
          fi
