name: computeforgood
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cfg
      POSTGRES_PASSWORD: cfg-local
      POSTGRES_DB: cfg
    ports:
      - "127.0.0.1:55471:5432"
    volumes:
      - cfg-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfg -d cfg"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment: &backend-env
      DEMO_MODE: "true"
      DATABASE_URL: postgresql+psycopg://cfg:cfg-local@postgres:5432/cfg
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5180,http://localhost:5180
      GITHUB_WEBHOOK_SECRET: local-demo-webhook-secret
      PUBLIC_URL: http://127.0.0.1:5180
      FRONTEND_URL: http://127.0.0.1:5180
      OAUTH_SECRET_KEY: ${OAUTH_SECRET_KEY:-}
    command: ["sh", "-c", "alembic upgrade head && python -m computeforgood.seed && uvicorn computeforgood.app:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health'))['status']=='ok'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
  worker:
    build: ./backend
    environment:
      <<: *backend-env
      WORKER_MODE: coordination
    command: ["python", "-m", "computeforgood.worker"]
    depends_on:
      backend:
        condition: service_healthy
  integration_worker:
    build: ./backend
    environment:
      <<: *backend-env
      WORKER_MODE: integrations
    command: ["python", "-m", "computeforgood.worker"]
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5180:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  cfg-postgres:
